[project]
name = "dtnnr-api"
version = "0.5.0"
description = "HTTP API and Postgres database storing generic characteristics of ION nodes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=46.0.7",
    "granian>=2.7.3",
    "litestar[sqlalchemy,standard]>=2.21.1",
    "psycopg[binary,pool]>=3.3.3",
    "sqlakeyset>=2.0.1775222100",
    "sqlalchemy-utils==0.41.2",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "granian[reload]>=2.7.3",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff.format]
quote-style = "single"

[tool.pytest]
testpaths = ["tests"]
